<svg width="1200" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Planète bleu métallique avec anneau rose tournoyant et étoiles éphémères">
  <defs>
    <radialGradient id="saturnBody" cx="34%" cy="28%" r="85%">
      <stop offset="0%"   stop-color="#c8d5e6"/>
      <stop offset="20%"  stop-color="#5e7190"/>
      <stop offset="48%"  stop-color="#2c3f60"/>
      <stop offset="75%"  stop-color="#162643"/>
      <stop offset="100%" stop-color="#040b1a"/>
    </radialGradient>
    <radialGradient id="rimGrad" cx="68%" cy="72%" r="62%">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="62%"  stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="82%"  stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="saturnHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1d4ed8" stop-opacity="0.28"/>
      <stop offset="55%"  stop-color="#1e3a8a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#172554" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fdf2f8" stop-opacity="0.95"/>
      <stop offset="45%"  stop-color="#f472b6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9d174d" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Noyau d'étoile -->
    <radialGradient id="starCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%"  stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="70%"  stop-color="#e0f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>

    <!-- Dégradé pour branches effilées -->
    <linearGradient id="branchH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="branchV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="planetClip"><circle r="30"/></clipPath>
    <clipPath id="ringBackClip"><rect x="-90" y="-90" width="180" height="90"/></clipPath>
    <clipPath id="ringFrontClip"><rect x="-90" y="0" width="180" height="90"/></clipPath>
    <filter id="trailGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="saturne">
    <animateMotion dur="26s" repeatCount="indefinite" path="M-70,100 C140,35 350,150 560,78 C770,25 990,145 1280,85"/>
    <circle r="60" fill="url(#saturnHalo)">
      <animate attributeName="r" values="56;64;56" dur="3.6s" repeatCount="indefinite"/>
    </circle>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
      <g transform="rotate(-16)" opacity="0.6">
        <g clip-path="url(#ringBackClip)">
          <ellipse rx="58" ry="19" fill="none" stroke="url(#ringGrad)" stroke-width="10.5">
            <animate attributeName="ry" values="19;15;19;22.5;19" dur="3.4s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse rx="47" ry="15.6" fill="none" stroke="#831843" stroke-width="5">
            <animate attributeName="ry" values="15.6;12.5;15.6;18.5;15.6" dur="3.4s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse rx="40.5" ry="13.3" fill="none" stroke="#fbcfe8" stroke-width="3" opacity="0.6">
            <animate attributeName="ry" values="13.3;10.6;13.3;15.6;13.3" dur="3.4s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse rx="58" ry="19" fill="none" stroke="#fdf2f8" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="65 63" stroke-dashoffset="0" opacity="0.4" filter="url(#trailGlow)">
            <animate attributeName="ry" values="19;15;19;22.5;19" dur="3.4s" repeatCount="indefinite"/>
            <animate attributeName="stroke-dashoffset" from="0" to="-256" dur="3.2s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse rx="58" ry="19" fill="none" stroke="#f9a8d4" stroke-width="5.6" stroke-linecap="round" stroke-dasharray="32 31.5" stroke-dashoffset="0" opacity="0.45" filter="url(#trailGlow)">
            <animate attributeName="ry" values="19;15;19;22.5;19" dur="3.4s" repeatCount="indefinite"/>
            <animate attributeName="stroke-dashoffset" from="0" to="-256" dur="5s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse rx="58" ry="19" fill="none" stroke="#fbcfe8" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="25.6 25.6" stroke-dashoffset="0" opacity="0.35" filter="url(#trailGlow)">
            <animate attributeName="ry" values="19;15;19;22.5;19" dur="3.4s" repeatCount="indefinite"/>
            <animate attributeName="stroke-dashoffset" from="0" to="256" dur="4.2s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse rx="58" ry="19" fill="none" stroke="#ffffff" stroke-width="2.4" opacity="0.8" stroke-dasharray="12.8 12.8" stroke-linecap="round">
            <animate attributeName="ry" values="19;15;19;22.5;19" dur="3.4s" repeatCount="indefinite"/>
            <animate attributeName="stroke-dashoffset" from="0" to="-256" dur="2.4s" repeatCount="indefinite"/>
          </ellipse>
        </g>
      </g>

      <circle r="30" fill="url(#saturnBody)"/>
      <g clip-path="url(#planetClip)">
        <ellipse cy="-17.6" rx="31.2" ry="3.8" fill="#3e5173" opacity="0.42"/>
        <ellipse cy="-11.6" rx="31.2" ry="4.4" fill="#5e7190" opacity="0.32"/>
        <ellipse cy="-5"   rx="31.2" ry="3.2" fill="#8ca4c4" opacity="0.22"/>
        <ellipse cy="1"    rx="31.2" ry="4"   fill="#1d304f" opacity="0.45"/>
        <ellipse cy="7"    rx="31.2" ry="3.5" fill="#425679" opacity="0.4"/>
        <ellipse cy="13"   rx="31.2" ry="4.2" fill="#0a1628" opacity="0.5"/>
        <ellipse cy="19.6" rx="31.2" ry="3.8" fill="#48627e" opacity="0.3"/>
        <ellipse cy="-17.6" rx="6.4" ry="2.2" fill="#bdc9d8" opacity="0">
          <animate attributeName="cx" values="-34;34" dur="4.6s" begin="0s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.18;0.82;1" dur="4.6s" begin="0s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cy="-11.6" rx="7.4" ry="2.4" fill="#7fa4cf" opacity="0">
          <animate attributeName="cx" values="-34;34" dur="3.8s" begin="1.1s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.18;0.82;1" dur="3.8s" begin="1.1s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cy="-5" rx="6" ry="2" fill="#c4d5ea" opacity="0">
          <animate attributeName="cx" values="-34;34" dur="5s" begin="2.3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.18;0.82;1" dur="5s" begin="2.3s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cy="1" rx="5" ry="1.8" fill="#d2e0f2" opacity="0">
          <animate attributeName="cx" values="-34;34" dur="4.2s" begin="0.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.55;0.55;0" keyTimes="0;0.18;0.82;1" dur="4.2s" begin="0.6s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cy="7" rx="7" ry="2.4" fill="#081627" opacity="0">
          <animate attributeName="cx" values="-34;34" dur="4.8s" begin="1.7s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.4;0.4;0" keyTimes="0;0.18;0.82;1" dur="4.8s" begin="1.7s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cy="13" rx="5.6" ry="2" fill="#99b4d2" opacity="0">
          <animate attributeName="cx" values="-34;34" dur="4s" begin="2.9s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.18;0.82;1" dur="4s" begin="2.9s" repeatCount="indefinite"/>
        </ellipse>
        <circle cx="12" cy="12" r="30" fill="#020617" opacity="0.32"/>
      </g>

      <g clip-path="url(#planetClip)" opacity="0.38">
        <g transform="translate(4,6) rotate(-16)">
          <ellipse rx="58" ry="19" fill="none" stroke="#020617" stroke-width="12">
            <animate attributeName="ry" values="19;15;19;22.5;19" dur="3.4s" repeatCount="indefinite"/>
          </ellipse>
        </g>
      </g>

      <g transform="rotate(-16)">
        <g clip-path="url(#ringFrontClip)">
          <ellipse rx="58" ry="19" fill="none" stroke="url(#ringGrad)" stroke-width="10.5">
            <animate attributeName="ry" values="19;15;19;22.5;19" dur="3.4s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse rx="47" ry="15.6" fill="none" stroke="#831843" stroke-width="5">
            <animate attributeName="ry" values="15.6;12.5;15.6;18.5;15.6" dur="3.4s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse rx="40.5" ry="13.3" fill="none" stroke="#fbcfe8" stroke-width="3" opacity="0.7">
            <animate attributeName="ry" values="13.3;10.6;13.3;15.6;13.3" dur="3.4s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse rx="58" ry="19" fill="none" stroke="#fdf2f8" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="65 63" stroke-dashoffset="0" opacity="0.4" filter="url(#trailGlow)">
            <animate attributeName="ry" values="19;15;19;22.5;19" dur="3.4s" repeatCount="indefinite"/>
            <animate attributeName="stroke-dashoffset" from="0" to="-256" dur="3.2s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse rx="58" ry="19" fill="none" stroke="#f9a8d4" stroke-width="5.6" stroke-linecap="round" stroke-dasharray="32 31.5" stroke-dashoffset="0" opacity="0.45" filter="url(#trailGlow)">
            <animate attributeName="ry" values="19;15;19;22.5;19" dur="3.4s" repeatCount="indefinite"/>
            <animate attributeName="stroke-dashoffset" from="0" to="-256" dur="5s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse rx="58" ry="19" fill="none" stroke="#fbcfe8" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="25.6 25.6" stroke-dashoffset="0" opacity="0.35" filter="url(#trailGlow)">
            <animate attributeName="ry" values="19;15;19;22.5;19" dur="3.4s" repeatCount="indefinite"/>
            <animate attributeName="stroke-dashoffset" from="0" to="256" dur="4.2s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse rx="58" ry="19" fill="none" stroke="#ffffff" stroke-width="2.4" opacity="0.8" stroke-dasharray="12.8 12.8" stroke-linecap="round">
            <animate attributeName="ry" values="19;15;19;22.5;19" dur="3.4s" repeatCount="indefinite"/>
            <animate attributeName="stroke-dashoffset" from="0" to="-256" dur="2.4s" repeatCount="indefinite"/>
          </ellipse>
        </g>
      </g>
    </g>

    <g clip-path="url(#planetClip)">
      <circle r="30" fill="url(#rimGrad)"/>
      <ellipse cx="-9" cy="-12" rx="10.4" ry="6.4" fill="#e8f1ff" opacity="0.5" transform="rotate(-28 -9 -12)"/>
      <ellipse cx="-10" cy="-13" rx="4.8" ry="3" fill="#ffffff" opacity="0.85" transform="rotate(-28 -10 -13)"/>
      <ellipse cx="6" cy="16" rx="5.6" ry="2.6" fill="#f9a8d4" opacity="0.22" transform="rotate(-20 6 16)"/>
    </g>

    <!-- ✨ ÉTOILES : branches fines effilées + noyau doux -->

    <g opacity="0">
      <animate attributeName="opacity"
        values="0;0;1;0.85;0;0"
        keyTimes="0;0.01;0.04;0.08;0.11;1"
        dur="27s" begin="0s" repeatCount="indefinite"/>
      <g transform="translate(64,-16)">
        <animateTransform attributeName="transform" type="rotate" values="0;45;0" dur="6s" repeatCount="indefinite" additive="sum"/>
        <line x1="-6" y1="0" x2="6" y2="0" stroke="url(#branchH)" stroke-width="0.7" stroke-linecap="round"/>
        <line x1="0" y1="-6" x2="0" y2="6" stroke="url(#branchV)" stroke-width="0.7" stroke-linecap="round"/>
        <circle r="2" fill="url(#starCore)"/>
      </g>
    </g>

    <g opacity="0">
      <animate attributeName="opacity"
        values="0;0;1;0.85;0;0"
        keyTimes="0;0.01;0.04;0.08;0.11;1"
        dur="31s" begin="6s" repeatCount="indefinite"/>
      <g transform="translate(-58,-34)">
        <animateTransform attributeName="transform" type="rotate" values="0;-45;0" dur="7s" repeatCount="indefinite" additive="sum"/>
        <line x1="-5" y1="0" x2="5" y2="0" stroke="url(#branchH)" stroke-width="0.6" stroke-linecap="round"/>
        <line x1="0" y1="-5" x2="0" y2="5" stroke="url(#branchV)" stroke-width="0.6" stroke-linecap="round"/>
        <circle r="1.7" fill="url(#starCore)"/>
      </g>
    </g>

    <g opacity="0">
      <animate attributeName="opacity"
        values="0;0;1;0.85;0;0"
        keyTimes="0;0.01;0.04;0.08;0.11;1"
        dur="23s" begin="11s" repeatCount="indefinite"/>
      <g transform="translate(50,34)">
        <animateTransform attributeName="transform" type="rotate" values="0;30;0" dur="5s" repeatCount="indefinite" additive="sum"/>
        <line x1="-4.5" y1="0" x2="4.5" y2="0" stroke="url(#branchH)" stroke-width="0.55" stroke-linecap="round"/>
        <line x1="0" y1="-4.5" x2="0" y2="4.5" stroke="url(#branchV)" stroke-width="0.55" stroke-linecap="round"/>
        <circle r="1.6" fill="url(#starCore)"/>
      </g>
    </g>

    <g opacity="0">
      <animate attributeName="opacity"
        values="0;0;1;0.85;0;0"
        keyTimes="0;0.01;0.04;0.08;0.11;1"
        dur="37s" begin="17s" repeatCount="indefinite"/>
      <g transform="translate(-44,40)">
        <animateTransform attributeName="transform" type="rotate" values="0;-30;0" dur="8s" repeatCount="indefinite" additive="sum"/>
        <line x1="-5" y1="0" x2="5" y2="0" stroke="url(#branchH)" stroke-width="0.6" stroke-linecap="round"/>
        <line x1="0" y1="-5" x2="0" y2="5" stroke="url(#branchV)" stroke-width="0.6" stroke-linecap="round"/>
        <circle r="1.8" fill="url(#starCore)"/>
      </g>
    </g>

    <g opacity="0">
      <animate attributeName="opacity"
        values="0;0;1;0.85;0;0"
        keyTimes="0;0.01;0.04;0.08;0.11;1"
        dur="29s" begin="23s" repeatCount="indefinite"/>
      <g transform="translate(72,14)">
        <animateTransform attributeName="transform" type="rotate" values="0;60;0" dur="6.5s" repeatCount="indefinite" additive="sum"/>
        <line x1="-5" y1="0" x2="5" y2="0" stroke="url(#branchH)" stroke-width="0.55" stroke-linecap="round"/>
        <line x1="0" y1="-5" x2="0" y2="5" stroke="url(#branchV)" stroke-width="0.55" stroke-linecap="round"/>
        <circle r="1.7" fill="url(#starCore)"/>
      </g>
    </g>
  </g>
</svg>
