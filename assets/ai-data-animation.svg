<svg width="1200" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Planète bleu métallique façon bille en rotation avec anneau entièrement rose tournoyant">
  <defs>
    <radialGradient id="saturnBody" cx="34%" cy="28%" r="85%">
      <stop offset="0%"   stop-color="#c8d5e6"/>
      <stop offset="20%"  stop-color="#5e7190"/>
      <stop offset="48%"  stop-color="#2c3f60"/>
      <stop offset="75%"  stop-color="#162643"/>
      <stop offset="100%" stop-color="#040b1a"/>
    </radialGradient>

    <radialGradient id="rimGrad" cx="68%" cy="72%" r="62%">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="62%"  stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="82%"  stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.4"/>
    </radialGradient>

    <radialGradient id="saturnHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1d4ed8" stop-opacity="0.28"/>
      <stop offset="55%"  stop-color="#1e3a8a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#172554" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fdf2f8" stop-opacity="0.95"/>
      <stop offset="45%"  stop-color="#f472b6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9d174d" stop-opacity="0.95"/>
    </linearGradient>

    <clipPath id="planetClip"><circle r="15"/></clipPath>
    <clipPath id="ringBackClip"><rect x="-45" y="-45" width="90" height="45"/></clipPath>
    <clipPath id="ringFrontClip"><rect x="-45" y="0" width="90" height="45"/></clipPath>

    <filter id="trailGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 🪐 SATURNE BILLE MÉTALLIQUE + ANNEAU ROSE TOURNOYANT -->
  <g id="saturne">
    <animateMotion dur="26s" repeatCount="indefinite" path="M-70,100 C140,35 350,150 560,78 C770,25 990,145 1280,85"/>

    <circle r="32" fill="url(#saturnHalo)">
      <animate attributeName="r" values="30;35;30" dur="3.6s" repeatCount="indefinite"/>
    </circle>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>

      <!-- 💍 Moitié ARRIÈRE de l'anneau rose tournoyant -->
      <g transform="rotate(-16)" opacity="0.6">
        <g clip-path="url(#ringBackClip)">
          <ellipse rx="30" ry="10" fill="none" stroke="url(#ringGrad)" stroke-width="5.6">
            <animate attributeName="ry" values="10;8;10;11.8;10" dur="3.4s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse rx="24.5" ry="8.2" fill="none" stroke="#831843" stroke-width="2.6">
            <animate attributeName="ry" values="8.2;6.6;8.2;9.7;8.2" dur="3.4s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse rx="21" ry="7" fill="none" stroke="#fbcfe8" stroke-width="1.6" opacity="0.6">
            <animate attributeName="ry" values="7;5.6;7;8.2;7" dur="3.4s" repeatCount="indefinite"/>
          </ellipse>

          <ellipse rx="30" ry="10" fill="none" stroke="#fdf2f8" stroke-width="2.4" stroke-linecap="round"
                    stroke-dasharray="34 33" stroke-dashoffset="0" opacity="0.35" filter="url(#trailGlow)">
            <animate attributeName="ry" values="10;8;10;11.8;10" dur="3.4s" repeatCount="indefinite"/>
            <animate attributeName="stroke-dashoffset" from="0" to="-134" dur="3.2s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse rx="30" ry="10" fill="none" stroke="#f9a8d4" stroke-width="3" stroke-linecap="round"
                    stroke-dasharray="17 16.5" stroke-dashoffset="0" opacity="0.4" filter="url(#trailGlow)">
            <animate attributeName="ry" values="10;8;10;11.8;10" dur="3.4s" repeatCount="indefinite"/>
            <animate attributeName="stroke-dashoffset" from="0" to="-134" dur="5s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse rx="30" ry="10" fill="none" stroke="#fbcfe8" stroke-width="1.4" stroke-linecap="round"
                    stroke-dasharray="13.4 13.4" stroke-dashoffset="0" opacity="0.3" filter="url(#trailGlow)">
            <animate attributeName="ry" values="10;8;10;11.8;10" dur="3.4s" repeatCount="indefinite"/>
            <animate attributeName="stroke-dashoffset" from="0" to="134" dur="4.2s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse rx="30" ry="10" fill="none" stroke="#ffffff" stroke-width="1.3" opacity="0.75"
                    stroke-dasharray="6.7 6.7" stroke-linecap="round">
            <animate attributeName="ry" values="10;8;10;11.8;10" dur="3.4s" repeatCount="indefinite"/>
            <animate attributeName="stroke-dashoffset" from="0" to="-134" dur="2.4s" repeatCount="indefinite"/>
          </ellipse>
        </g>
      </g>

      <!-- Globe -->
      <circle r="15" fill="url(#saturnBody)"/>
      <g clip-path="url(#planetClip)">
        <ellipse cy="-8.8" rx="15.6" ry="1.9" fill="#3e5173" opacity="0.42"/>
        <ellipse cy="-5.8" rx="15.6" ry="2.2" fill="#5e7190" opacity="0.32"/>
        <ellipse cy="-2.5" rx="15.6" ry="1.6" fill="#8ca4c4" opacity="0.22"/>
        <ellipse cy="0.5"  rx="15.6" ry="2"   fill="#1d304f" opacity="0.45"/>
        <ellipse cy="3.5"  rx="15.6" ry="1.75" fill="#425679" opacity="0.4"/>
        <ellipse cy="6.5"  rx="15.6" ry="2.1" fill="#0a1628" opacity="0.5"/>
        <ellipse cy="9.8"  rx="15.6" ry="1.9" fill="#48627e" opacity="0.3"/>

        <ellipse cy="-8.8" rx="3.2" ry="1.1" fill="#bdc9d8" opacity="0">
          <animate attributeName="cx" values="-17;17" dur="4.6s" begin="0s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.18;0.82;1" dur="4.6s" begin="0s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cy="-5.8" rx="3.7" ry="1.2" fill="#7fa4cf" opacity="0">
          <animate attributeName="cx" values="-17;17" dur="3.8s" begin="1.1s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.18;0.82;1" dur="3.8s" begin="1.1s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cy="-2.5" rx="3" ry="1" fill="#c4d5ea" opacity="0">
          <animate attributeName="cx" values="-17;17" dur="5s" begin="2.3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.18;0.82;1" dur="5s" begin="2.3s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cy="0.5" rx="2.5" ry="0.9" fill="#d2e0f2" opacity="0">
          <animate attributeName="cx" values="-17;17" dur="4.2s" begin="0.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.55;0.55;0" keyTimes="0;0.18;0.82;1" dur="4.2s" begin="0.6s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cy="3.5" rx="3.5" ry="1.2" fill="#081627" opacity="0">
          <animate attributeName="cx" values="-17;17" dur="4.8s" begin="1.7s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.4;0.4;0" keyTimes="0;0.18;0.82;1" dur="4.8s" begin="1.7s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cy="6.5" rx="2.8" ry="1" fill="#99b4d2" opacity="0">
          <animate attributeName="cx" values="-17;17" dur="4s" begin="2.9s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.18;0.82;1" dur="4s" begin="2.9s" repeatCount="indefinite"/>
        </ellipse>

        <circle cx="6" cy="6" r="15" fill="#020617" opacity="0.32"/>
      </g>

      <!-- Ombre portée de l'anneau -->
      <g clip-path="url(#planetClip)" opacity="0.38">
        <g transform="translate(2,3) rotate(-16)">
          <ellipse rx="30" ry="10" fill="none" stroke="#020617" stroke-width="6.4">
            <animate attributeName="ry" values="10;8;10;11.8;10" dur="3.4s" repeatCount="indefinite"/>
          </ellipse>
        </g>
      </g>

      <!-- 💍 Moitié AVANTE de l'anneau rose tournoyant -->
      <g transform="rotate(-16)">
        <g clip-path="url(#ringFrontClip)">
          <ellipse rx="30" ry="10" fill="none" stroke="url(#ringGrad)" stroke-width="5.6">
            <animate attributeName="ry" values="10;8;10;11.8;10" dur="3.4s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse rx="24.5" ry="8.2" fill="none" stroke="#831843" stroke-width="2.6">
            <animate attributeName="ry" values="8.2;6.6;8.2;9.7;8.2" dur="3.4s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse rx="21" ry="7" fill="none" stroke="#fbcfe8" stroke-width="1.6" opacity="0.7">
            <animate attributeName="ry" values="7;5.6;7;8.2;7" dur="3.4s" repeatCount="indefinite"/>
          </ellipse>

          <ellipse rx="30" ry="10" fill="none" stroke="#fdf2f8" stroke-width="2.4" stroke-linecap="round"
                    stroke-dasharray="34 33" stroke-dashoffset="0" opacity="0.35" filter="url(#trailGlow)">
            <animate attributeName="ry" values="10;8;10;11.8;10" dur="3.4s" repeatCount="indefinite"/>
            <animate attributeName="stroke-dashoffset" from="0" to="-134" dur="3.2s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse rx="30" ry="10" fill="none" stroke="#f9a8d4" stroke-width="3" stroke-linecap="round"
                    stroke-dasharray="17 16.5" stroke-dashoffset="0" opacity="0.4" filter="url(#trailGlow)">
            <animate attributeName="ry" values="10;8;10;11.8;10" dur="3.4s" repeatCount="indefinite"/>
            <animate attributeName="stroke-dashoffset" from="0" to="-134" dur="5s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse rx="30" ry="10" fill="none" stroke="#fbcfe8" stroke-width="1.4" stroke-linecap="round"
                    stroke-dasharray="13.4 13.4" stroke-dashoffset="0" opacity="0.3" filter="url(#trailGlow)">
            <animate attributeName="ry" values="10;8;10;11.8;10" dur="3.4s" repeatCount="indefinite"/>
            <animate attributeName="stroke-dashoffset" from="0" to="134" dur="4.2s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse rx="30" ry="10" fill="none" stroke="#ffffff" stroke-width="1.3" opacity="0.75"
                    stroke-dasharray="6.7 6.7" stroke-linecap="round">
            <animate attributeName="ry" values="10;8;10;11.8;10" dur="3.4s" repeatCount="indefinite"/>
            <animate attributeName="stroke-dashoffset" from="0" to="-134" dur="2.4s" repeatCount="indefinite"/>
          </ellipse>
        </g>
      </g>
    </g>

    <!-- ✨ Reflets MÉTALLIQUES FIXES -->
    <g clip-path="url(#planetClip)">
      <circle r="15" fill="url(#rimGrad)"/>
      <ellipse cx="-4.5" cy="-6" rx="5.2" ry="3.2" fill="#e8f1ff" opacity="0.5" transform="rotate(-28 -4.5 -6)"/>
      <ellipse cx="-5" cy="-6.5" rx="2.4" ry="1.5" fill="#ffffff" opacity="0.85" transform="rotate(-28 -5 -6.5)"/>
      <ellipse cx="3" cy="8" rx="2.8" ry="1.3" fill="#f9a8d4" opacity="0.22" transform="rotate(-20 3 8)"/>
    </g>

    <!-- ✨ Étoiles -->
    <path d="M22,-19 l1.6,4 4,1.6 -4,1.6 -1.6,4 -1.6,-4 -4,-1.6 4,-1.6 z" fill="#f0f9ff" opacity="0">
      <animate attributeName="opacity"
        values="0;0;0.55;0.15;0.7;0.2;0.6;0.1;0.45;0;0"
        keyTimes="0;0.28;0.32;0.36;0.4;0.45;0.5;0.55;0.6;0.66;1"
        dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M-24,-30 l1.2,3 3,1.2 -3,1.2 -1.2,3 -1.2,-3 -3,-1.2 3,-1.2 z" fill="#f0f9ff" opacity="0">
      <animate attributeName="opacity"
        values="0;0;0.5;0.1;0.65;0.15;0.4;0;0"
        keyTimes="0;0.35;0.4;0.45;0.5;0.56;0.62;0.68;1"
        dur="13s" begin="3.5s" repeatCount="indefinite"/>
    </path>

    <!-- Lune en orbite -->
    <circle r="2.2" fill="#e0f2fe">
      <animateMotion dur="7s" repeatCount="indefinite" path="M -42,0 A 42,17 0 1,1 42,0 A 42,17 0 1,1 -42,0"/>
      <animate attributeName="opacity" values="0.95;0.5;0.95" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
